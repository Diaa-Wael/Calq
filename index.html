<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15171a" />
    <meta name="description" content="Calq — a responsive scientific calculator with a classic natural-display keypad." />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/svg+xml" href="/calculator.svg" />
    <title>Calq</title>
  </head>
  <body>
    <main class="page">
      <section class="calculator" aria-label="Calq scientific calculator">
        <header class="top-brand">
          <div class="wordmark-wrap">
            <div class="wordmark">CALQ</div>
            <div class="model-name">fx-991ES PLUS</div>
            <div class="natural">NATURAL-V.P.A.M.</div>
          </div>
          <div class="top-right">
            <div class="solar-strip" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </div>
            <div class="edition">2nd edition</div>
          </div>
        </header>

        <section class="display-frame" aria-label="Calculator display">
          <div class="display-topline">
            <div class="status-left">
              <span id="shift-indicator">SHIFT</span>
              <span id="alpha-indicator">ALPHA</span>
            </div>
            <div class="status-right">
              <span id="angle-indicator">DEG</span>
              <span id="memory-indicator">M</span>
            </div>
          </div>
          <div class="screen" id="screen" tabindex="0" aria-live="polite">
            <div class="screen-expression" id="expression">0</div>
            <div class="screen-result" id="display">0</div>
          </div>
        </section>

        <section class="top-controls" aria-label="Calculator controls">
          <div class="control-stack">
            <span class="caption yellow">SHIFT</span>
            <button class="key round-key mode-key" data-action="shift" aria-label="Shift">SHIFT</button>
          </div>
          <div class="control-stack">
            <span class="caption red">ALPHA</span>
            <button class="key round-key mode-key" data-action="alpha" aria-label="Alpha">ALPHA</button>
          </div>

          <button class="replay" id="replay" type="button" aria-label="Replay previous calculations">
            <span class="replay-arrow up">▲</span>
            <span class="replay-arrow left">◀</span>
            <span class="replay-arrow right">▶</span>
            <span class="replay-arrow down">▼</span>
            <span class="replay-center">OK</span>
          </button>

          <div class="control-stack">
            <span class="caption white">MODE SETUP</span>
            <button class="key round-key mode-key" data-action="mode" aria-label="Mode and setup">MODE</button>
          </div>
          <div class="control-stack">
            <span class="caption white">ON</span>
            <button class="key round-key mode-key on-key" data-action="power" aria-label="Power">ON</button>
          </div>
        </section>

        <section class="scientific-grid" id="scientific-grid" aria-label="Scientific function keys">
          <button class="key fn-key" data-action="calc"><span class="shift-label">SOLVE =</span><strong>CALC</strong></button>
          <button class="key fn-key" data-action="integral"><span class="shift-label">d/dx</span><strong>∫dx</strong></button>
          <button class="key fn-key" data-action="reciprocal"><span class="shift-label">x!</span><strong>x⁻¹</strong></button>
          <button class="key fn-key" data-action="root"><span class="shift-label">x⁻¹</span><strong>√</strong></button>
          <button class="key fn-key" data-action="logbase"><span class="shift-label">10ˣ</span><strong>log□</strong></button>

          <button class="key fn-key fraction-key" data-action="fraction" aria-label="Fraction"><span class="shift-label">d/c</span><strong class="fraction-symbol" aria-hidden="true"><span class="fraction-box"></span><span class="fraction-bar"></span><span class="fraction-box fraction-den"></span></strong></button>
          <button class="key fn-key" data-action="sqrt"><span class="shift-label">∛</span><strong>√</strong></button>
          <button class="key fn-key" data-action="square"><span class="shift-label">x³</span><strong>x²</strong></button>
          <button class="key fn-key power-key" data-action="powerFn" aria-label="x to the power of y"><span class="shift-label">x¹⁄ʸ</span><strong class="power-symbol" aria-hidden="true"><span class="x-letter">x</span><span class="power-box"></span></strong></button>
          <button class="key fn-key" data-action="log"><span class="shift-label">10ˣ</span><strong>log</strong></button>

          <button class="key fn-key" data-action="ln"><span class="shift-label">eˣ</span><strong>ln</strong></button>
          <button class="key fn-key" data-action="negate"><span class="shift-label">CONST</span><strong>(−)</strong></button>
          <button class="key fn-key" data-action="angle"><span class="shift-label">DRG▶</span><strong>°′″</strong></button>
          <button class="key fn-key" data-action="hyp"><span class="shift-label">hyp⁻¹</span><strong>hyp</strong></button>
          <button class="key fn-key trig-key" data-action="sin" data-normal="sin" data-shift="sin⁻¹"><span class="shift-label">sin⁻¹</span><strong class="trig-main">sin</strong></button>

          <button class="key fn-key trig-key" data-action="cos" data-normal="cos" data-shift="cos⁻¹"><span class="shift-label">cos⁻¹</span><strong class="trig-main">cos</strong></button>
          <button class="key fn-key trig-key" data-action="tan" data-normal="tan" data-shift="tan⁻¹"><span class="shift-label">tan⁻¹</span><strong class="trig-main">tan</strong></button>
          <button class="key fn-key" data-action="rcl"><span class="shift-label">STO</span><strong>RCL</strong></button>
          <button class="key fn-key" data-action="eng"><span class="shift-label">Rnd</span><strong>ENG</strong></button>
          <button class="key fn-key" data-action="toggleFraction"><span class="shift-label">▶DEC</span><strong>S⇔D</strong></button>

          <button class="key fn-key" data-action="leftParen"><span class="shift-label">STAT</span><strong>(</strong></button>
          <button class="key fn-key" data-action="rightParen"><span class="shift-label">SETUP</span><strong>)</strong></button>
          <button class="key fn-key" data-action="pi"><span class="shift-label">e</span><strong>π</strong></button>
          <button class="key fn-key" data-action="constant"><span class="shift-label">SCI</span><strong>CONST</strong></button>
          <button class="key fn-key" data-action="percent"><span class="shift-label">RAN#</span><strong>%</strong></button>
        </section>

        <section class="number-grid" id="number-grid" aria-label="Number and operator keys">
          <button class="key number-key" data-digit="7"><span class="secondary">CONST</span><strong>7</strong></button>
          <button class="key number-key" data-digit="8"><span class="secondary">VECTOR</span><strong>8</strong></button>
          <button class="key number-key" data-digit="9"><span class="secondary">MATRIX</span><strong>9</strong></button>
          <button class="key edit-key" data-action="delete"><span class="secondary">CLR</span><strong>DEL</strong></button>
          <button class="key ac-key" data-action="clear"><span class="secondary">OFF</span><strong>AC</strong></button>

          <button class="key number-key" data-digit="4"><span class="secondary">STAT</span><strong>4</strong></button>
          <button class="key number-key" data-digit="5"><span class="secondary">CMPLX</span><strong>5</strong></button>
          <button class="key number-key" data-digit="6"><span class="secondary">BASE</span><strong>6</strong></button>
          <button class="key operator-key" data-action="multiply"><span class="secondary">nPr</span><strong>×</strong></button>
          <button class="key operator-key" data-action="divide"><span class="secondary">nCr</span><strong>÷</strong></button>

          <button class="key number-key" data-digit="1"><span class="secondary">MATRIX</span><strong>1</strong></button>
          <button class="key number-key" data-digit="2"><span class="secondary">CMPLX</span><strong>2</strong></button>
          <button class="key number-key" data-digit="3"><span class="secondary">BASE-N</span><strong>3</strong></button>
          <button class="key operator-key" data-action="add"><span class="secondary">nPr</span><strong>+</strong></button>
          <button class="key operator-key" data-action="subtract"><span class="secondary">nCr</span><strong>−</strong></button>

          <button class="key number-key" data-action="zero"><span class="secondary">RanInt</span><strong>0</strong></button>
          <button class="key number-key" data-action="decimal"><span class="secondary">π</span><strong>·</strong></button>
          <button class="key number-key exp-key" data-action="exp"><span class="secondary">e</span><strong>×10ˣ</strong></button>
          <button class="key answer-key" data-action="answer"><span class="secondary">DRG▶</span><strong>Ans</strong></button>
          <button class="key equals-key" data-action="equals"><span class="secondary">EXE</span><strong>=</strong></button>
        </section>

        <footer class="footer-note">
          <span>CALQ • NATURAL DISPLAY</span>
          <span>Scientific • Responsive • Touch</span>
        </footer>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
