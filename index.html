<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15181d" />
    <meta name="description" content="Calq — a modern responsive scientific calculator inspired by a classic ES-style keypad." />
    <link rel="icon" type="image/svg+xml" href="/calculator.svg" />
    <title>Calq</title>
  </head>
  <body>
    <main class="page">
      <section class="calculator" aria-label="Calq scientific calculator">
        <header class="calculator-top">
          <div class="branding">
            <span class="brand">CALQ</span>
            <span class="model">NATURAL DISPLAY</span>
          </div>
          <div class="solar" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </div>
          <button class="ghost-btn" id="theme-toggle" type="button" aria-label="Toggle display theme">◐</button>
        </header>

        <section class="screen-shell" aria-label="Calculator display">
          <div class="screen-status">
            <span id="shift-indicator">SHIFT</span>
            <span id="alpha-indicator">ALPHA</span>
            <span class="status-spacer"></span>
            <span id="angle-indicator">DEG</span>
            <span id="memory-indicator">M</span>
          </div>
          <div class="screen-expression" id="expression" aria-live="polite">&nbsp;</div>
          <div class="screen-value" id="display" aria-live="polite">0</div>
        </section>

        <section class="control-row" aria-label="Main controls">
          <button class="key key-round" data-action="shift" type="button"><small></small><b>SHIFT</b></button>
          <button class="key key-round" data-action="alpha" type="button"><small></small><b>ALPHA</b></button>
          <button class="replay" id="replay" type="button" aria-label="Replay controls">
            <span class="replay-ring">
              <span class="replay-up">▲</span>
              <span class="replay-left">◀</span>
              <span class="replay-right">▶</span>
              <span class="replay-down">▼</span>
              <span class="replay-center">•</span>
            </span>
          </button>
          <button class="key key-round" data-action="mode" type="button"><small></small><b>MODE</b></button>
          <button class="key key-round" data-action="power" type="button"><small></small><b>ON</b></button>
        </section>

        <section class="function-grid" id="function-grid" aria-label="Scientific functions">
          <button class="key sci" data-action="calc" type="button"><small>SOLVE</small><b>CALC</b></button>
          <button class="key sci" data-action="integral" type="button"><small>d/dx</small><b>∫dx</b></button>
          <button class="key sci" data-action="reciprocal" type="button"><small>x!</small><b>x⁻¹</b></button>
          <button class="key sci" data-action="logbase" type="button"><small>√</small><b>logₐb</b></button>
          <button class="key sci" data-action="sqrt" type="button"><small>∛</small><b>√</b></button>

          <button class="key sci" data-action="square" type="button"><small>x³</small><b>x²</b></button>
          <button class="key sci" data-action="powerFn" type="button"><small>x⁻¹</small><b>xʸ</b></button>
          <button class="key sci" data-action="log" type="button"><small>10ˣ</small><b>log</b></button>
          <button class="key sci" data-action="ln" type="button"><small>eˣ</small><b>ln</b></button>
          <button class="key sci" data-action="negate" type="button"><small>(−)</small><b>(−)</b></button>

          <button class="key sci" data-action="angle" type="button"><small>°′″</small><b>°′″</b></button>
          <button class="key sci" data-action="hyp" type="button"><small>hyp⁻¹</small><b>hyp</b></button>
          <button class="key sci" data-action="sin" type="button"><small>sin⁻¹</small><b>sin</b></button>
          <button class="key sci" data-action="cos" type="button"><small>cos⁻¹</small><b>cos</b></button>
          <button class="key sci" data-action="tan" type="button"><small>tan⁻¹</small><b>tan</b></button>

          <button class="key sci" data-action="rcl" type="button"><small>STO</small><b>RCL</b></button>
          <button class="key sci" data-action="eng" type="button"><small>Rnd</small><b>ENG</b></button>
          <button class="key sci" data-action="leftParen" type="button"><small>X</small><b>(</b></button>
          <button class="key sci" data-action="rightParen" type="button"><small>Y</small><b>)</b></button>
          <button class="key sci" data-action="toggleFraction" type="button"><small>▶DEC</small><b>S⇔D</b></button>
        </section>

        <section class="main-grid" id="main-grid" aria-label="Number and operation keys">
          <button class="key num" data-digit="7" type="button"><small>OCT</small><b>7</b></button>
          <button class="key num" data-digit="8" type="button"><small>BIN</small><b>8</b></button>
          <button class="key num" data-digit="9" type="button"><small>HEX</small><b>9</b></button>
          <button class="key utility" data-action="delete" type="button"><b>DEL</b></button>
          <button class="key danger" data-action="clear" type="button"><b>AC</b></button>

          <button class="key num" data-digit="4" type="button"><small>Q</small><b>4</b></button>
          <button class="key num" data-digit="5" type="button"><small>R</small><b>5</b></button>
          <button class="key num" data-digit="6" type="button"><small>S</small><b>6</b></button>
          <button class="key op" data-action="multiply" type="button"><small>nPr</small><b>×</b></button>
          <button class="key op" data-action="divide" type="button"><small>nCr</small><b>÷</b></button>

          <button class="key num" data-digit="1" type="button"><small>V</small><b>1</b></button>
          <button class="key num" data-digit="2" type="button"><small>W</small><b>2</b></button>
          <button class="key num" data-digit="3" type="button"><small>X</small><b>3</b></button>
          <button class="key op" data-action="add" type="button"><small>Y</small><b>+</b></button>
          <button class="key op" data-action="subtract" type="button"><small>Z</small><b>−</b></button>

          <button class="key num" data-digit="0" type="button"><small>Ran#</small><b>0</b></button>
          <button class="key num" data-action="decimal" type="button"><small>π</small><b>.</b></button>
          <button class="key num wide-label" data-action="exp" type="button"><small>e</small><b>×10ˣ</b></button>
          <button class="key memory" data-action="answer" type="button"><small>DRG▶</small><b>Ans</b></button>
          <button class="key equals" data-action="equals" type="button"><small>EXE</small><b>=</b></button>
        </section>

        <footer class="calculator-footer">
          <span>417-function inspired layout</span>
          <span>Keyboard + touch</span>
        </footer>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
