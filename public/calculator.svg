<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Calq calculator icon</title>
  <desc id="desc">A compact scientific calculator with a green LCD display and raised gray keys.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5054"/>
      <stop offset="1" stop-color="#202326"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e8d9"/>
      <stop offset="1" stop-color="#a6c1aa"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f1"/>
      <stop offset="1" stop-color="#a7adb1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="18" y="6" width="92" height="116" rx="17" fill="#151719" opacity=".18"/>
  <rect x="14" y="4" width="92" height="116" rx="17" fill="url(#body)" stroke="#101214" stroke-width="3" filter="url(#shadow)"/>

  <rect x="22" y="17" width="76" height="27" rx="4" fill="url(#screen)" stroke="#7e8b83" stroke-width="2"/>
  <rect x="25" y="20" width="70" height="21" rx="2" fill="#c6d9c9" opacity=".55"/>
  <path d="M26 38h68" stroke="#9aafa0" opacity=".5"/>

  <text x="24" y="12.8" font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="800" letter-spacing="1.1" fill="#f0f1f1">CALQ</text>
  <text x="83" y="12.8" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="3.5" font-weight="700" fill="#cfd3d5">SCIENTIFIC</text>

  <g transform="translate(22 50)">
    <g fill="#1d2022" stroke="#0f1112" stroke-width=".8">
      <rect x="0" y="0" width="12" height="7" rx="2"/>
      <rect x="16" y="0" width="12" height="7" rx="2"/>
      <rect x="32" y="0" width="12" height="7" rx="2"/>
      <rect x="48" y="0" width="12" height="7" rx="2"/>
      <rect x="64" y="0" width="12" height="7" rx="2"/>
    </g>

    <g fill="url(#key)" stroke="#595f63" stroke-width=".8">
      <rect x="0" y="11" width="12" height="10" rx="2.3"/>
      <rect x="16" y="11" width="12" height="10" rx="2.3"/>
      <rect x="32" y="11" width="12" height="10" rx="2.3"/>
      <rect x="48" y="11" width="12" height="10" rx="2.3"/>
      <rect x="64" y="11" width="12" height="10" rx="2.3"/>

      <rect x="0" y="25" width="12" height="10" rx="2.3"/>
      <rect x="16" y="25" width="12" height="10" rx="2.3"/>
      <rect x="32" y="25" width="12" height="10" rx="2.3"/>
      <rect x="48" y="25" width="12" height="10" rx="2.3"/>
      <rect x="64" y="25" width="12" height="10" rx="2.3"/>

      <rect x="0" y="39" width="12" height="10" rx="2.3"/>
      <rect x="16" y="39" width="12" height="10" rx="2.3"/>
      <rect x="32" y="39" width="12" height="10" rx="2.3"/>
      <rect x="48" y="39" width="12" height="10" rx="2.3"/>
      <rect x="64" y="39" width="12" height="10" rx="2.3"/>

      <rect x="0" y="53" width="12" height="10" rx="2.3"/>
      <rect x="16" y="53" width="12" height="10" rx="2.3"/>
      <rect x="32" y="53" width="12" height="10" rx="2.3"/>
      <rect x="48" y="53" width="12" height="10" rx="2.3"/>
      <rect x="64" y="53" width="12" height="10" rx="2.3"/>
    </g>

    <g fill="#d7dbdd">
      <circle cx="6" cy="16" r="1.8"/><circle cx="22" cy="16" r="1.8"/><circle cx="38" cy="16" r="1.8"/><circle cx="54" cy="16" r="1.8"/><circle cx="70" cy="16" r="1.8"/>
      <circle cx="6" cy="30" r="1.8"/><circle cx="22" cy="30" r="1.8"/><circle cx="38" cy="30" r="1.8"/><circle cx="54" cy="30" r="1.8"/><circle cx="70" cy="30" r="1.8"/>
      <circle cx="6" cy="44" r="1.8"/><circle cx="22" cy="44" r="1.8"/><circle cx="38" cy="44" r="1.8"/><circle cx="54" cy="44" r="1.8"/><circle cx="70" cy="44" r="1.8"/>
      <circle cx="6" cy="58" r="1.8"/><circle cx="22" cy="58" r="1.8"/><circle cx="38" cy="58" r="1.8"/><circle cx="54" cy="58" r="1.8"/><circle cx="70" cy="58" r="1.8"/>
    </g>
  </g>
</svg>
